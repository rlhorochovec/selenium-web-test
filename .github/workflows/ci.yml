name: Testes Web com Selenium e Java

on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Execução do Selenium
    runs-on: ubuntu-latest
    steps:
      # Verifica (faz checkout) o seu repositório no $GITHUB_WORKSPACE para o job poder acessá-lo
      - name: Verificar repositório
        uses: actions/checkout@v3

      # Configura o ambiente Java JDK 17 (Eclipse Temurin) com cache do Maven habilitado
      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Baixa e instala a versão estável mais recente do Google Chrome no runner Linux
      - name: Instalar Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      # Configura o ChromeDriver no ambiente para automação do navegador
      - name: Instalar ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # Realiza o build do projeto e executa os testes automatizados utilizando o Maven
      - name: Compilar e executar testes com Maven
        run: mvn clean verify
        env:
          CUCUMBER_PUBLISH_TOKEN: ${{ secrets.CUCUMBER_PUBLISH_TOKEN }}

      # Publica o relatório HTML do Cucumber gerado no GitHub Pages
      - name: Publicar relatório do Cucumber
        if: always() # Garante que execute mesmo se os testes falharem nas etapas anteriores
        uses: peaceiris/actions-gh-pages@v3.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/cucumber-report-html/cucumber-html-reports
          publish_branch: gh-pages